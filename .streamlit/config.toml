# Dark theme for the app; the colours match set_style(dark=True) in spherex/plots.py,
# so the Streamlit page and the matplotlib figures look the same.
[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#232321"
textColor = "#f0efec"
borderColor = "#383835"
